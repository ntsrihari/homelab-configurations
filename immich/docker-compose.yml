#
# Immich stack for this Windows PC (Docker Desktop / WSL2 backend).
# Based verbatim on the official release v3.1.0 docker-compose.yml:
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# TWO intentional local changes vs. upstream, both marked "### LOCAL CHANGE":
#   1) database: uses a Docker-managed NAMED VOLUME (pgdata) instead of an
#      NTFS bind mount — required; Postgres must not live on a Windows path.
#   2) immich-server: adds a READ-ONLY external library mount for I:\Photos.
#
# Everything else (images, digests, healthchecks, ports) is unchanged upstream.
#

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    volumes:
      # Do not edit the next line. If you want to change the media storage location on your system, edit the value of UPLOAD_LOCATION in the .env file
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
      ### LOCAL CHANGE (1 of 2): read-only external library (existing collection on I:\Photos).
      ### Immich can never move/rename/delete/modify files under a :ro mount.
      ### The UI import path for this library is /mnt/photos
      - ${EXTERNAL_LIBRARY}:/mnt/photos:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    # For hardware acceleration, add one of -[armnn, cuda, rocm, openvino, rknn] to the image tag.
    # Example tag: ${IMMICH_VERSION:-release}-cuda
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}
    # extends: # uncomment this section for hardware acceleration - see https://docs.immich.app/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, rocm, openvino, openvino-wsl, rknn] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Uncomment the DB_STORAGE_TYPE: 'HDD' var if your database isn't stored on SSDs
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      ### LOCAL CHANGE (2 of 2): Docker-managed named volume instead of ${DB_DATA_LOCATION} bind mount.
      ### Postgres data lives inside the Docker/WSL2 ext4 VHDX, never on NTFS. Do not edit this line.
      - pgdata:/var/lib/postgresql/data
    shm_size: 128mb
    restart: always
    healthcheck:
      disable: false

volumes:
  model-cache:
  ### LOCAL CHANGE: declares the Docker-managed Postgres volume referenced above.
  pgdata:
