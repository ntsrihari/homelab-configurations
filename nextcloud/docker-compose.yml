name: nextcloud

services:
  nextcloud-db:
    container_name: nextcloud_db
    image: mariadb:lts
    restart: always

    command:
      - "--transaction-isolation=READ-COMMITTED"
      - "--log-bin=binlog"
      - "--binlog-format=ROW"

    volumes:
      - db:/var/lib/mysql

    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MYSQL_DATABASE}
      MARIADB_USER: ${MYSQL_USER}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 20s
      timeout: 5s
      retries: 10

    networks:
      - nextcloud

  nextcloud-redis:
    container_name: nextcloud_redis
    image: redis:7-alpine
    restart: always

    command:
      - redis-server
      - "--save"
      - "60"
      - "1"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 10

    networks:
      - nextcloud

  nextcloud-app:
    container_name: nextcloud_app
    image: nextcloud:stable-apache
    restart: always

    ports:
      - "19123:80"

    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy

    volumes:
      - nextcloud:/var/www/html
      - ${NEXTCLOUD_DATA}:/var/www/html/data

    environment:
      MYSQL_HOST: nextcloud-db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: nextcloud-redis

      NEXTCLOUD_TRUSTED_DOMAINS: ${TRUSTED_DOMAINS}

      PHP_TZ: ${TZ}
      PHP_UPLOAD_LIMIT: 16G
      PHP_MEMORY_LIMIT: 1G

      # HTTPS is terminated by `tailscale serve` in front of this container, reached at
      # https://srihari-pc.beaver-augmented.ts.net (tailnet only). Protocol is detected
      # per-request from X-Forwarded-Proto (Nextcloud `trusted_proxies` = docker subnet,
      # set via occ). Do NOT set OVERWRITEPROTOCOL=https here: it forces https on EVERY
      # request and breaks plain-HTTP LAN access (http://192.168.29.96:19123) with an
      # SSL protocol error. See README-nextcloud.md / memory.

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/status.php"]
      interval: 30s
      timeout: 10s
      retries: 10

    networks:
      - nextcloud

volumes:
  db:
    name: nextcloud_db

  nextcloud:
    name: nextcloud_app

networks:
  nextcloud:
    name: nextcloud_network